name: Abby family library release checks
on:
  pull_request:
    branches: [my-revit-tool]
permissions:
  contents: read
concurrency:
  group: abby-library-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  release-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Preserve generated-page line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and validate complete release
        shell: pwsh
        run: |
          node scripts/abby/check-public-source.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Public source check failed' }
          ./scripts/abby/New-AbbyPackage.ps1 -Version abby-my-revit-tool-prcheck
          node --test family-library/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Library configuration tests failed' }
          ./tests/abby-family-library.ps1 -Package output/releases/Abby-MCP-abby-my-revit-tool-prcheck.zip
          ./tests/abby-update-safety.ps1
          ./tests/abby-bootstrap.ps1
          node --test tests/abby-*.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed' }
          Push-Location MCP-Server
          node --test tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'MCP contract tests failed' }
          Pop-Location
          ./scripts/verify-qaqc.ps1 -SkipBuild -SkipDeploy
